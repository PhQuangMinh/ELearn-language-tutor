spring:
  application:
    name: BTL_Mobile

  # Load .env for local runs (supports running from repo root or Backend/)
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./Backend/.env[.properties]

  datasource:
    # Support both new (DB_*) and old (MARIADB_*) env names
    url: ${DB_URL:jdbc:mariadb://${MARIADB_ADDR:localhost}/btl_mobile?useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${MARIADB_USERNAME:}}
    password: ${DB_PASSWORD:${MARIADB_PASSWORD:}}

  jpa:
    hibernate:
      # Disable Hibernate auto schema changes; Liquibase is source of truth
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

  # OAuth2 redirect flow: bấm "Đăng nhập Google/FB" -> chuyển tới Google/FB -> quay lại nhận JWT
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID}}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET}}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          facebook:
            client-id: ${OAUTH2_FACEBOOK_APP_ID:${FACEBOOK_APP_ID}}
            client-secret: ${OAUTH2_FACEBOOK_APP_SECRET:${FACEBOOK_APP_SECRET}}
            scope: public_profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v18.0/dialog/oauth
            token-uri: https://graph.facebook.com/v18.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

jwt:
  # Support both JWT_SECRET and legacy JWT_SECRET_KEY
  secret: ${JWT_SECRET:${JWT_SECRET_KEY}}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

oauth2:
  # URL cho app Android: scheme elearn:// để app bắt deep link và nhận token
  mobile-redirect-url: ${OAUTH2_MOBILE_REDIRECT_URL:${MOBILE_REDIRECT_URL:elearn://login/callback}}
