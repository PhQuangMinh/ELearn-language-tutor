spring:
  application:
    name: BTL_Mobile
  
  datasource:
    url: jdbc:mysql://localhost:3306/btl_mobile?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 21122004
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # OAuth2 redirect flow: bấm "Đăng nhập Google/FB" -> chuyển tới Google/FB -> quay lại nhận JWT
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${oauth2.google.client-id}
            client-secret: ${oauth2.google.client-secret}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          facebook:
            client-id: ${oauth2.facebook.app-id}
            client-secret: ${oauth2.facebook.app-secret}
            scope: public_profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v18.0/dialog/oauth
            token-uri: https://graph.facebook.com/v18.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: BTLMobileSecretKeyForJWTTokenGenerationAndValidation2026ThisIsAVeryLongSecretKeyToEnsureSecurityAndMeetTheMinimumRequirements
  expiration: 900000  
  refresh-expiration: 604800000

oauth2:
  google:
    client-id: 454969516364-5j0vmvl2ghh1rie2klb543o6kj8vh90j.apps.googleusercontent.com
    client-secret: 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
  facebook:
    app-id: 1575619266897525
    app-secret: a8e227580eddb1a79364b891d81e12c6
  # URL cho app Android: scheme elearn:// để app bắt deep link và nhận token
  mobile-redirect-url: elearn://login/callback

