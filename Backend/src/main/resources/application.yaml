spring:
  application:
    name: BTL_Mobile

  devtools:
    restart:
      enabled: ${DEVTOOLS_RESTART_ENABLED:true}

  # Load .env for local runs (supports running from repo root or Backend/)
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./Backend/.env[.properties]

  datasource:
    # Support both new (DB_*) and old (MARIADB_*) env names
    url: ${DB_URL:jdbc:mariadb://${MARIADB_ADDR:localhost}/btl_mobile?useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${MARIADB_USERNAME:}}
    password: ${DB_PASSWORD:${MARIADB_PASSWORD:}}

  jpa:
    hibernate:
      # Disable Hibernate auto schema changes; Liquibase is source of truth
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

  mail:
    host: smtp.gmail.com
    port: 587
    # username/password lấy từ env: SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD (hoặc spring.mail.username/password)
    username: ${SPRING_MAIL_USERNAME:${spring.mail.username:}}
    password: ${SPRING_MAIL_PASSWORD:${spring.mail.password:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 redirect flow: bấm "Đăng nhập Google" -> chuyển tới Google -> quay lại nhận JWT
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID}}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET}}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

jwt:
  # Support both JWT_SECRET and legacy JWT_SECRET_KEY
  secret: ${JWT_SECRET:${JWT_SECRET_KEY}}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

oauth2:
  # URL cho app Android: scheme elearn:// để app bắt deep link và nhận token
  mobile-redirect-url: ${OAUTH2_MOBILE_REDIRECT_URL:${MOBILE_REDIRECT_URL:elearn://login/callback}}

gemini:
  # Default model if GEMINI_MODEL isn't set in .env
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  api-key: ${GEMINI_API_KEY:}

app:
  mail:
    # Only changes the display name. Email address still uses spring.mail.username
    from-name: ${MAIL_FROM_NAME:ELearn}
